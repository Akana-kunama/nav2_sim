slam_toolbox:
  ros__parameters:
    
    use_sim_time: true  # Use simulation time
    
    mode: “localization“     # Options: "mapping", "localization", etc.
    
    map_server_uri: file:///mnt/nvme1n1p6/PLCT/NAV2/nav2_sim/src/robot_slam/maps/map_mar_19.yaml
    map_frame: map   # Frame ID for the map
    odom_frame: odom # Frame ID for odometry
    base_frame: base_link  # Frame ID for the robot base
    

    map_start_at_dock: true
    scan_queue_size: 1
    # scan_topic: /scan  # Topic name for laser scans
    # max_laser_range: 3.5      # Maximum laser range in meters
    # min_laser_range: 0.12        # Minimum laser range in meters
    # angle_min: -3.1400000           # -90 degrees in radians
    # angle_max: 3.1400            # 90 degrees in radians
    # samples: 360                 # Number of laser scan samples
    # resolution:  0.05000           # Laser scan resolution


    # Mapping Mode Parameters
    map_resolution: 0.05  # Meters per cell
    # publish_map: true  # Publish the map to the /map topic
    # publish_pose: true  # Publish the robot's pose
    # save_map_timeout: 0.0  # Save the map immediately when requested
    # map_update_interval: 1.0  # Seconds between map updates

    # Particle Filter Parameters
    min_num_particles: 500
    max_num_particles: 2000
    update_interval: 1.0  # Seconds between particle filter updates

    # Occupancy Grid Parameters
    occupancy_threshold: 0.5
    free_threshold: 0.3

    # Pose Estimation Parameters
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # Logging and Debugging
    log_debug: false
    log_info: true
    log_warn: true
    log_error: true